[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moneymakers"
version = "0.1.0"
description = "Scan sibling git repositories, score monetization heuristics, serve a local dashboard, optionally export to Google Drive."
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
google = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
]

[tool.setuptools]
py-modules = ["projectscan", "drive_workspace_setup_wizard"]
